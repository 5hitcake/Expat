name: Supabase keep-alive

# Supabase's free tier pauses a project after 7 days without API activity.
# This pings the REST API daily so the Board never gets auto-paused, even
# accounting for a lag in how Supabase's own inactivity scan picks up
# recent requests (a twice-weekly ping still triggered a pause warning).
# Uses the same public anon key that's already shipped client-side in
# board.js — read-only, RLS-protected.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://lecciiekoeprcihwnquy.supabase.co/rest/v1/board_posts?select=id&limit=1" \
            -H "apikey: sb_publishable_Ci5wrxnimzEsOshQfXVaDA_QM4YRZGq" \
            -H "Authorization: Bearer sb_publishable_Ci5wrxnimzEsOshQfXVaDA_QM4YRZGq")
          echo "Supabase responded with HTTP $status"
          if [ "$status" -ge 400 ]; then
            echo "::error::Supabase keep-alive ping failed with HTTP $status"
            exit 1
          fi
